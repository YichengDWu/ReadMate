<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReadMate PDF Reader</title>
    <link rel="stylesheet" href="content.css" />
    <link rel="stylesheet" href="pdf-viewer.css" />
  </head>
  <body>
    <!-- Top toolbar -->
    <header id="viewer-toolbar">
      <div class="toolbar-left">
        <div class="brand">
          <img src="icons/icon-32.png" alt="ReadMate Logo" class="brand-icon" />
          <span class="brand-name">ReadMate <span class="badge">PDF</span></span>
        </div>
        <button id="openFileBtn" class="toolbar-btn primary-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span data-i18n="pdf.openFile">打开文件</span>
        </button>
        <input type="file" id="fileInput" accept=".pdf,application/pdf" style="display: none;" />
      </div>

      <div class="toolbar-center">
        <div class="nav-group">
          <button id="prevPageBtn" class="toolbar-icon-btn" type="button" title="上一页" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div class="page-indicator">
            <input type="number" id="pageNumberInput" value="1" min="1" max="1" disabled />
            <span class="page-divider">/</span>
            <span id="pageCountSpan">--</span>
          </div>
          <button id="nextPageBtn" class="toolbar-icon-btn" type="button" title="下一页" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

        <div class="divider"></div>

        <div class="zoom-group">
          <button id="zoomOutBtn" class="toolbar-icon-btn" type="button" title="缩小" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <span id="zoomPercentSpan" class="zoom-label">100%</span>
          <button id="zoomInBtn" class="toolbar-icon-btn" type="button" title="放大" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button id="fitWidthBtn" class="toolbar-btn subtle-btn" type="button" data-i18n="pdf.fitWidth">自适应</button>
        </div>
      </div>

      <div class="toolbar-right">
        <div id="continuousReadingStatus" class="continuous-status is-hidden">
          <span class="status-pulse-dot"></span>
          <span id="continuousProgressText">正在朗读第 1 / 1 页</span>
        </div>
        <button id="readPageBtn" class="toolbar-btn secondary-btn" type="button" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          <span data-i18n="pdf.readPage">朗读本页</span>
        </button>
        <button id="readContinuousBtn" class="toolbar-btn primary-btn continuous-btn" type="button" disabled>
          <svg class="icon-play-next" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke-width="2.5"></line></svg>
          <span id="readContinuousLabel" data-i18n="pdf.continuousRead">连续朗读</span>
        </button>
        <button id="openSettingsBtn" class="toolbar-icon-btn" type="button" title="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <!-- Main viewer container -->
    <main id="viewer-container">
      <!-- Empty dropzone state -->
      <div id="dropzone" class="dropzone-visible">
        <div class="dropzone-card">
          <div class="dropzone-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          </div>
          <h2 data-i18n="pdf.dropzoneTitle">拖拽 PDF 文件到此处打开</h2>
          <p data-i18n="pdf.dropzoneDesc">或者点击下方按钮选择本地文件，或输入网络 PDF 链接</p>
          <div class="dropzone-actions">
            <button id="dropzoneSelectBtn" class="btn btn-primary" type="button" data-i18n="pdf.selectFile">选择本地 PDF</button>
            <div class="url-input-row">
              <input type="url" id="pdfUrlInput" placeholder="https://example.com/document.pdf" data-i18n-placeholder="pdf.urlPlaceholder" />
              <button id="openUrlBtn" class="btn btn-secondary" type="button" data-i18n="pdf.openUrl">打开</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading / status overlay -->
      <div id="viewer-status" class="viewer-status-hidden">
        <div class="status-spinner inworld-spin"></div>
        <span id="statusMessage">加载 PDF 中...</span>
      </div>

      <!-- Document pages render container -->
      <div id="pdf-pages-wrapper"></div>
    </main>

    <!-- PDF.js library -->
    <script src="lib/pdfjs/pdf.min.js"></script>
    <!-- Localization & TTS Content Script -->
    <script src="i18n.js"></script>
    <script src="content.js"></script>
    <!-- Viewer controller -->
    <script src="pdf-viewer.js"></script>
  </body>
</html>
